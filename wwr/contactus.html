<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rafting Adventure</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Adventure Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contactus.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <div class="info-box">
                <h2>Visit Us</h2>
                <p>📍 Calle 12 # 4-56, San Gil, Santander</p>
                <p>📞 +57 300 123 4567</p>
                <p>📧 info@raftingadventure.co</p>
            </div>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3959.282!2d-73.13!3d6.55!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNsKwMzMnMDAuMCJOIDczwrA3OCcwMC4wIlc!5e0!3m2!1ses!2sco!4v1620000000000!5m2!1ses!2sco"
                  width="100%" height="250" style="border:0;" allowfullscreen=""
                  loading="lazy"></iframe>
            </div>
        </section>

        <form action="#" method="post">
            <fieldset>
                <legend>Send us a Message</legend>
                <label for="user_name">Full Name:</label>
                <input type="text" id="user_name" name="user_name" required placeholder="Your name">

                <label for="user_email">Email:</label>
                <input type="email" id="user_email" name="user_email" required
                  placeholder="email@example.com">
            </fieldset>

            <fieldset>
                <legend>Message</legend>
                <label for="message">Details:</label>
                <textarea id="message" name="user_message" rows="4"></textarea>
            </fieldset>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Rafting Adventure | J. Alexis Sanchez</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="FB"></a>
            <a href="#"><img src="images/twitter.png" alt="TW"></a>
        </nav>
    </footer>
</body>

</html>
