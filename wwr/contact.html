<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rafting Adventure</title>
    <meta name="description"
      content="Contact Rafting Adventure for the best whitewater experience in San Gil, Santander.">
    <meta name="author" content="J. Alexis Sanchez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Rafting Adventure Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <input type="checkbox" id="subscribe" name="subscribe">
            <label for="subscribe" style="display: inline;">Subscribe to newsletter</label>

            <label for="comments">Questions:</label>
            <textarea id="comments" name="comments"></textarea>

            <fieldset>
                <legend>Select your experience level:</legend>
                <input type="radio" id="beg" name="level" value="beginner"><label
                  for="beg">Beginner</label>
                <input type="radio" id="int" name="level" value="intermediate"><label
                  for="int">Intermediate</label>
                <input type="radio" id="adv" name="level" value="advanced"><label
                  for="adv">Advanced</label>
            </fieldset>

            <label><input type="checkbox" name="subscribe"> Subscribe to newsletter</label>

            <button type="submit">Send My Message</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Rafting Adventure | J. Alexis Sanchez</p>
        <nav class="socialmedia">
            <a href="#"><img src="images/facebook.png" alt="FB social media icon"></a>
            <a href="#"><img src="images/twitter.png" alt="TW social media icon"></a>
            <a href="#"><img src="images/instagram.png" alt="IG social media icon"></a>
        </nav>
    </footer>
</body>

</html>
