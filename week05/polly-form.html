<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
    </header>

    <main>
        <form>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="useremail">Email Address:</label>
            <input type="useremail" name="useremail" id="useremail" required>

            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Brave</option>
                <option value="5">Other</option>
            </select>

            <label><input type="checkbox" id="pet" name="pet">Do you have a household pet?</label>

            <label for="feedback">List the places you have lived.</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mail"></textarea>
            <button type="submit"> Submit Contact Information</button>
        </form>
    </main>

    <footer>
    </footer>
</body>

</html>
